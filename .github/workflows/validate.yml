---
name: Validate GitOps

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install YAML and shell validation tools
        run: |
          python -m pip install yamllint==1.38.0
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Validate repository and rendered charts
        run: ./scripts/validate.sh
