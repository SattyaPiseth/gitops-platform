# Allow Internal Workload Communication and External State Dependencies (DB, Redis, S3)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gitlab-workloads
  namespace: gitlab
  labels:
    app.kubernetes.io/part-of: gitlab
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow intra-namespace traffic between GitLab pods
    - from:
        - podSelector: {}
  egress:
    # Allow intra-namespace traffic between GitLab pods
    - to:
        - podSelector: {}

    # External PostgreSQL production endpoint: postgres.k8s.tss.local
    - to:
        - ipBlock:
            cidr: 172.16.6.201/32
      ports:
        - protocol: TCP
          port: 5432

    # Redis production endpoint currently resolves to the internal LB address.
    - to:
        - ipBlock:
            cidr: 172.16.6.200/32
      ports:
        - protocol: TCP
          port: 6379

    # HTTPS remains destination-open until S3 and approved external API CIDRs
    # are inventoried; Kubernetes NetworkPolicy cannot select DNS names.
    - ports:
        - protocol: TCP
          port: 443

    # SSH remains destination-open for user-configured external Git remotes.
    - ports:
        - protocol: TCP
          port: 22
