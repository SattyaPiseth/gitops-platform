# Allow Internal Workload Communication and External State Dependencies (DB, Redis, S3)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gitlab-workloads
  namespace: gitlab
  labels:
    app.kubernetes.io/part-of: gitlab
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow intra-namespace traffic between GitLab pods
    - from:
        - podSelector: {}
    # Allow the Redis Operator to reconcile replication roles and Sentinel.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redis-operator
          podSelector:
            matchLabels:
              name: redis-operator
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379

    # Allow the CNPG operator to query the instance-manager status endpoint.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000

  egress:
    # Allow intra-namespace traffic between GitLab pods
    - to:
        - podSelector: {}

    # Kubernetes API backends (the CNI enforces policy after Service DNAT).
    - to:
        - ipBlock:
            cidr: 172.16.6.20/32
        - ipBlock:
            cidr: 172.16.6.21/32
        - ipBlock:
            cidr: 172.16.6.22/32
      ports:
        - protocol: TCP
          port: 6443

    # MinIO S3 API. Service traffic is enforced after DNAT on pod port 9000.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minio-system
          podSelector:
            matchLabels:
              v1.min.io/tenant: minio
      ports:
        - protocol: TCP
          port: 9000

    # Internal HTTPS ingress path. Service port 443 is DNATed to Traefik
    # container port 8443 before NetworkPolicy enforcement.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8443

    # HTTPS remains destination-open until S3 and approved external API CIDRs
    # are inventoried; Kubernetes NetworkPolicy cannot select DNS names.
    - ports:
        - protocol: TCP
          port: 443

    # SSH remains destination-open for user-configured external Git remotes.
    - ports:
        - protocol: TCP
          port: 22

---
# The external SMTP relay uses DNS names rather than stable destination CIDRs,
# so this rule limits access by source workload and SMTP submission port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-smtp-egress
  namespace: gitlab
  labels:
    app.kubernetes.io/part-of: gitlab
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - sidekiq
          - toolbox
          - webservice
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 587
