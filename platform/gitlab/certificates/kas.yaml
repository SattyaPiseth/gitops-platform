apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitlab-kas-tls
  namespace: gitlab
spec:
  secretName: gitlab-kas-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always

  issuerRef:
    name: k8s-internal-ca
    kind: ClusterIssuer

  dnsNames:
    - kas.k8s.tss.local
