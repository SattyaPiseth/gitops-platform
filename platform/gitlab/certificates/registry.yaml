apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitlab-registry-tls
  namespace: gitlab
spec:
  secretName: gitlab-registry-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always

  issuerRef:
    name: k8s-internal-ca
    kind: ClusterIssuer

  dnsNames:
    - registry.k8s.tss.local
