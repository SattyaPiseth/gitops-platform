# Backup prerequisites only; Cluster plugin activation is a separate change.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: gitlab-postgresql-backup
  namespace: gitlab
  annotations:
    # The generated Secret must exist before the ObjectStore and Cluster use it.
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    app.kubernetes.io/part-of: gitlab
    app.kubernetes.io/managed-by: argocd
spec:
  vaultAuthRef: gitlab-vault-auth
  type: kv-v2
  mount: kv
  path: gitlab/postgresql-backup
  refreshAfter: 5m
  hmacSecretData: true
  destination:
    create: true
    name: gitlab-postgresql-backup
    # CNPG reloads this Secret when Vault rotates the object-store credential.
    labels:
      cnpg.io/reload: ""
    transformation:
      excludeRaw: true
      includes:
        - '^accessKeyId$'
        - '^secretAccessKey$'
