---
# GitLab Runner Authentication Token (Scoped to Runner Identity)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: gitlab-runner-secret
  namespace: gitlab
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/part-of: gitlab-runner
    app.kubernetes.io/managed-by: argocd
spec:
  hmacSecretData: true
  type: kv-v2
  mount: kv
  path: gitlab-runner/auth
  vaultAuthRef: gitlab-runner-vault-auth
  destination:
    name: gitlab-runner-secret
    create: true
    transformation:
      excludeRaw: true
      includes:
        - '^runner-token$'
      templates:
        runner-registration-token:
          text: ""
  refreshAfter: 5m

---
# SMTP Relay Credentials
# Store a dedicated SMTP username and password at kv/gitlab/smtp. GitLab
# consumes only the generated Kubernetes Secret.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: gitlab-smtp
  namespace: gitlab
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/part-of: gitlab
    app.kubernetes.io/managed-by: argocd
spec:
  hmacSecretData: true
  type: kv-v2
  mount: kv
  path: gitlab/smtp
  vaultAuthRef: gitlab-vault-auth
  rolloutRestartTargets:
    - kind: Deployment
      name: gitlab-sidekiq-all-in-1-v2
    - kind: Deployment
      name: gitlab-toolbox
    - kind: Deployment
      name: gitlab-webservice-default
  destination:
    name: gitlab-smtp
    create: true
    transformation:
      excludeRaw: true
      includes:
        - '^username$'
        - '^password$'
  refreshAfter: 5m
