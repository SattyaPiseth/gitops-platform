# Backup prerequisites only; Cluster plugin activation is a separate change.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: gitlab-postgresql-backups
  namespace: gitlab
  labels:
    app.kubernetes.io/part-of: gitlab
    app.kubernetes.io/managed-by: argocd
spec:
  configuration:
    destinationPath: s3://cnpg-backups/gitlab-production/
    endpointURL: https://minio.minio-system.svc.cluster.local
    endpointCA:
      name: gitlab-tls
      key: ca.crt
    s3Credentials:
      accessKeyId:
        name: gitlab-postgresql-backup
        key: accessKeyId
      secretAccessKey:
        name: gitlab-postgresql-backup
        key: secretAccessKey
    data:
      compression: gzip
      jobs: 1
    wal:
      compression: gzip
