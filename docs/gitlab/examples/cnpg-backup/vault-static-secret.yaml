# Draft only; outside Argo discovery paths.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: gitlab-postgresql-backup
  namespace: gitlab
spec:
  vaultAuthRef: gitlab-vault-auth
  type: kv-v2
  mount: kv
  path: gitlab/postgresql-backup
  refreshAfter: 5m
  hmacSecretData: true
  destination:
    create: true
    name: gitlab-postgresql-backup
    transformation:
      excludeRaw: true
      includes:
        - '^accessKeyId$'
        - '^secretAccessKey$'
