global:

  #
  # PostgreSQL
  #
  psql:
    host: gitlab-postgresql-rw.gitlab.svc.cluster.local
    port: 5432

    database: gitlabhq_production
    username: gitlab

    password:
      secret: gitlab-postgresql
      key: password

  #
  # Redis / Valkey
  #
  redis:
    # Sentinel primary group name, not a DNS hostname.
    host: mymaster
    port: 6379

    sentinels:
      - host: gitlab-redis-s-hl.gitlab.svc.cluster.local
        port: 26379

    auth:
      enabled: true
      secret: gitlab-redis
      key: password


  #
  # Object storage
  #
  appConfig:
    object_store:
      enabled: true

      connection:
        secret: gitlab-object-storage
        key: connection

      proxy_download: true

    artifacts:
      bucket: gitlab-artifacts

    lfs:
      bucket: gitlab-lfs

    uploads:
      bucket: gitlab-uploads

    packages:
      bucket: gitlab-packages

    externalDiffs:
      bucket: gitlab-mr-diffs

    terraformState:
      bucket: gitlab-terraform-state

    dependencyProxy:
      bucket: gitlab-dependency-proxy

    backups:
      bucket: gitlab-backups
      tmpBucket: gitlab-backup-tmp

  # The Registry chart reads its storage configuration from the dedicated
  # Secret below, while GitLab backup/restore needs the bucket name globally.
  registry:
    bucket: gitlab-registry


#
# Registry object storage
#
registry:
  enabled: true

  storage:
    secret: gitlab-registry-storage
    key: config


#
# Backup configuration
#
gitlab:
  toolbox:
    backups:
      # Preparation only: enable after external-copy and isolated-restore gates pass.
      cron:
        enabled: false
        suspend: true
        # Proposed daily time; confirm the maintenance window before activation.
        schedule: "0 2 * * *"
        timeZone: Asia/Phnom_Penh
        concurrencyPolicy: Forbid
        startingDeadlineSeconds: 600
        backoffLimit: 0
        restartPolicy: Never
        successfulJobsHistoryLimit: 3
        failedJobsHistoryLimit: 3
        safeToEvict: false
        # Disabled features verified against live configuration and bucket inventory.
        extraArgs: >-
          --skip pages --skip ci_secure_files --skip agent_plan_content
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
            
        persistence:
          enabled: true
          size: 10Gi
          storageClass: longhorn
          accessMode: ReadWriteOnce

      objectStorage:
        config:
          secret: gitlab-backup-object-storage
          key: config
