global:
  edition: ce

  # Trust the internal CA used by MinIO and other platform services. Project
  # only the public CA key; never mount the TLS private key into GitLab pods.
  certificates:
    customCAs:
      - secret: gitlab-tls
        keys:
          - ca.crt

  # Use fully-qualified Service DNS names and avoid redundant search-domain
  # lookups for external endpoints such as s3.k8s.tss.local.
  clusterDomain: cluster.local
  dnsConfig:
    options:
      - name: ndots
        value: "2"

  hosts:
    domain: k8s.tss.local

    gitlab:
      name: gitlab.k8s.tss.local
      https: true

    registry:
      name: registry.k8s.tss.local
      https: true

    kas:
      name: kas.k8s.tss.local

  gatewayApi:
    enabled: false
    installEnvoy: false
    configureCertmanager: false

  ingress:
    enabled: true
    provider: traefik
    class: traefik

    # Kubernetes 1.35
    apiVersion: networking.k8s.io/v1
    configureCertmanager: false

    tls:
      enabled: true

  hpa:
    apiVersion: autoscaling/v2

  pdb:
    apiVersion: policy/v1

  traefik:
    apiVersion: traefik.io/v1alpha1

  shell:
    port: 22

  revisionHistoryLimit: 5

# Disable only for initial Argo CD installation.
upgradeCheck:
  enabled: false

# Do not deploy GitLab's bundled ingress controller.
nginx-ingress:
  enabled: false


# cert-manager already exists in the platform.
installCertmanager: false


# Keep GitLab's issuer helper inactive.
certmanager-issuer:
  email: ""


# Existing kube-prometheus-stack handles monitoring.
prometheus:
  install: false


# Existing platform Traefik handles ingress.
traefik:
  install: false


gitlab:
  webservice:
    minReplicas: 2
    maxReplicas: 3

    ingress:
      tls:
        secretName: gitlab-tls

  sidekiq:
    minReplicas: 2
    maxReplicas: 3

  kas:
    minReplicas: 2
    maxReplicas: 3

    ingress:
      tls:
        secretName: gitlab-kas-tls

  gitlab-shell:
    minReplicas: 2
    maxReplicas: 3

    traefik:
      ingressClassName: traefik
      entrypoint: gitlab-shell

  toolbox:
    replicas: 1

  gitaly:
    persistence:
      storageClass: longhorn
      size: 50Gi


registry:
  hpa:
    minReplicas: 2
    maxReplicas: 3

  ingress:
    tls:
      secretName: gitlab-registry-tls

# A separately managed Runner release consumes the Vault-provided
# gitlab-runner-secret. Do not install the parent chart's bundled Runner.
gitlab-runner:
  install: false
