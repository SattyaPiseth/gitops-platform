global:
  edition: ce

  # Trust the internal CA used by MinIO and other platform services. Project
  # only the public CA key; never mount the TLS private key into GitLab pods.
  certificates:
    customCAs:
      - secret: gitlab-tls
        keys:
          - ca.crt

  # Use fully-qualified Service DNS names and avoid redundant search-domain
  # lookups for external endpoints such as s3.k8s.tss.local.
  clusterDomain: cluster.local
  dnsConfig:
    options:
      - name: ndots
        value: "2"

  hosts:
    domain: k8s.tss.local

    gitlab:
      name: gitlab.k8s.tss.local
      https: true

    registry:
      name: registry.k8s.tss.local
      https: true

    kas:
      name: kas.k8s.tss.local

  gatewayApi:
    enabled: false
    installEnvoy: false
    configureCertmanager: false

  ingress:
    enabled: true
    provider: traefik
    class: traefik

    # Kubernetes 1.35
    apiVersion: networking.k8s.io/v1
    configureCertmanager: false

    tls:
      enabled: true

  hpa:
    apiVersion: autoscaling/v2

  pdb:
    apiVersion: policy/v1

  traefik:
    apiVersion: traefik.io/v1alpha1

  shell:
    port: 22

  revisionHistoryLimit: 5

  # Transactional email is delivered through Brevo. Credentials are
  # synchronized from Vault by platform/gitlab/vault.
  smtp:
    enabled: true
    address: smtp-relay.brevo.com
    port: 587
    user_name_secret:
      secret: gitlab-smtp
      key: username
    password:
      secret: gitlab-smtp
      key: password
    domain: gitlab-mail.memora-shine.shop
    authentication: plain
    starttls_auto: true
    tls: false
    openssl_verify_mode: peer

  email:
    from: gitlab@gitlab-mail.memora-shine.shop
    display_name: GitLab
    reply_to: noreply@gitlab-mail.memora-shine.shop

# Disable only for initial Argo CD installation.
upgradeCheck:
  enabled: false

# Do not deploy GitLab's bundled ingress controller.
nginx-ingress:
  enabled: false


# cert-manager already exists in the platform.
installCertmanager: false


# Keep GitLab's issuer helper inactive.
certmanager-issuer:
  email: ""


# Existing kube-prometheus-stack handles monitoring.
prometheus:
  install: false


# Existing platform Traefik handles ingress.
traefik:
  install: false


gitlab:
  webservice:
    minReplicas: 2
    maxReplicas: 3

    # Keep Rails workloads on worker/storage nodes and prefer an even spread.
    # ScheduleAnyway preserves availability when this constrained cluster does
    # not have enough spare capacity on every worker.
    nodeSelector:
      node-role.kubernetes.io/storage: "true"
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: webservice

    # Avoid surge deadlocks on capacity-constrained worker nodes.
    deployment:
      startupProbe:
        httpGet:
          path: /-/liveness
          port: 8080
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 120
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1

    ingress:
      tls:
        secretName: gitlab-tls

  sidekiq:
    minReplicas: 2
    maxReplicas: 3

    # Avoid concentrating memory-heavy Sidekiq replicas on one worker.
    nodeSelector:
      node-role.kubernetes.io/storage: "true"
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: sidekiq

    # Rails initialization exceeds the upstream 20-second liveness delay on
    # these workers. Readiness remains active while startup completes.
    livenessProbe:
      initialDelaySeconds: 600
      periodSeconds: 60
      timeoutSeconds: 30
      successThreshold: 1
      failureThreshold: 3

    # Keep one replica available while replacing pods without extra capacity.
    deployment:
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1

  kas:
    minReplicas: 2
    maxReplicas: 3

    ingress:
      tls:
        secretName: gitlab-kas-tls

  gitlab-shell:
    minReplicas: 2
    maxReplicas: 3

    traefik:
      ingressClassName: traefik
      entrypoint: gitlab-shell

  toolbox:
    replicas: 1
    # Rails maintenance commands need substantially more capacity than the
    # chart's minimal defaults on this shared, resource-constrained cluster.
    resources:
      requests:
        cpu: 500m
        memory: 1Gi

  gitaly:
    persistence:
      storageClass: longhorn
      size: 50Gi


registry:
  hpa:
    minReplicas: 2
    maxReplicas: 3

  ingress:
    tls:
      secretName: gitlab-registry-tls

# A separately managed Runner release consumes the Vault-provided
# gitlab-runner-secret. Do not install the parent chart's bundled Runner.
gitlab-runner:
  install: false
