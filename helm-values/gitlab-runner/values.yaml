# GitLab Runner Helm Values
# Chart: gitlab/gitlab-runner (0.91.3)
# Namespace: gitlab

gitlabUrl: https://gitlab.k8s.tss.local/

# Trust the cert-manager CA using Runner's required hostname filename.
volumeMounts:
  - name: gitlab-runner-ca
    mountPath: /home/gitlab-runner/.gitlab-runner/certs/
    readOnly: true

volumes:
  - name: gitlab-runner-ca
    secret:
      secretName: gitlab-tls
      items:
        - key: ca.crt
          path: gitlab.k8s.tss.local.crt

# Preserve the public TLS hostname while avoiding MetalLB hairpin traffic.
hostAliases:
  - ip: "10.233.57.145"
    hostnames:
      - gitlab.k8s.tss.local

# Number of concurrent jobs to run
concurrent: 10

# Polling interval in seconds
checkInterval: 30

rbac:
  create: true
  clusterWideAccess: false

runners:
  name: k8s-production-runner
  tags: "k8s,production,linux"
  locked: false
  runUntagged: true

  # Secret containing the runner registration or authentication token
  # Key: runner-registration-token or runner-token
  secret: gitlab-runner-secret

  # Executor configuration
  config: |
    [[runners]]
      request_concurrency = 2
      [runners.kubernetes]
        namespace = "gitlab"
        image = "ubuntu:24.04"
        privileged = false
        cpu_request = "250m"
        cpu_limit = "2"
        memory_request = "512Mi"
        memory_limit = "4Gi"
        service_cpu_request = "100m"
        service_cpu_limit = "1"
        service_memory_request = "256Mi"
        service_memory_limit = "2Gi"
        poll_interval = 5
        poll_timeout = 3600
        [[runners.kubernetes.host_aliases]]
          ip = "10.233.57.145"
          hostnames = ["gitlab.k8s.tss.local"]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
