# Longhorn Distributed Block Storage Helm Values
# Chart: longhorn/longhorn (v1.12.0 → App: v1.12.0)
# Namespace: longhorn-system

defaultSettings:
  defaultReplicaCount: 3
  defaultDataPath: /var/lib/longhorn
  defaultDataLocality: best-effort
  allowVolumeCreationWithDegradedAvailability: "false"
  # V1 sparse volumes currently consume less than 3% of physical capacity.
  # Keep the 25% physical-free guard while allowing controlled thin provisioning.
  storageOverProvisioningPercentage: 150
  storageMinimalAvailablePercentage: 25
  replicaSoftAntiAffinity: "false"
  priorityClass: longhorn-critical

persistence:
  defaultClass: true
  defaultClassReplicaCount: 3
  reclaimPolicy: Delete

csi:
  attacherReplicaCount: 2
  provisionerReplicaCount: 2
  resizerReplicaCount: 2
  snapshotterReplicaCount: 2

metrics:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
    interval: 30s
    scrapeTimeout: 10s
