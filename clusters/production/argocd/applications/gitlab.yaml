apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
  name: gitlab
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: gitlab
  sources:
    - repoURL: https://charts.gitlab.io/
      chart: gitlab
      targetRevision: 10.2.6
      helm:
        releaseName: gitlab
        valueFiles:
          - $values/helm-values/gitlab/values.yaml
          - $values/helm-values/gitlab/values-production.yaml
    - repoURL: https://github.com/SattyaPiseth/gitops-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab
  # Stateful version changes require an observed manual sync.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
