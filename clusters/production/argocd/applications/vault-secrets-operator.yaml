apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  sources:
    # Source 1: official HashiCorp Helm chart
    - repoURL: https://helm.releases.hashicorp.com
      chart: vault-secrets-operator
      targetRevision: 0.9.1
      helm:
        releaseName: vault-secrets-operator
        valueFiles:
          - $values/helm-values/vault-secrets-operator/values.yaml

    # Source 2: values + additional Kubernetes resources
    - repoURL: https://github.com/SattyaPiseth/gitops-platform.git
      targetRevision: main
      ref: values
      path: clusters/production/argocd/resources/vault-secrets-operator

  destination:
    server: https://kubernetes.default.svc
    namespace: vault-secrets-operator-system

  # Argo CD v2.14's static schema predates the Kubernetes v1.35 field.
  # TODO: Remove after upgrading Argo CD to a Kubernetes v1.35-compatible release.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
