apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd

spec:
  project: platform

  sources:
    # Headlamp official Helm chart
    - repoURL: https://kubernetes-sigs.github.io/headlamp/
      chart: headlamp
      targetRevision: 0.43.0
      helm:
        releaseName: headlamp
        valueFiles:
          - $values/helm-values/headlamp/values.yaml

    # Git repository containing Helm values
    - repoURL: https://github.com/SattyaPiseth/gitops-platform.git
      targetRevision: main
      ref: values

    # Git repository containing Kubernetes resources
    - repoURL: https://github.com/SattyaPiseth/gitops-platform.git
      targetRevision: main
      path: clusters/production/argocd/resources/headlamp

  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
