apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://operator.min.io
      chart: tenant
      targetRevision: 7.1.1
      helm:
        releaseName: minio
        valueFiles:
          - $values/helm-values/minio/values.yaml
    - repoURL: https://github.com/SattyaPiseth/gitops-platform.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/SattyaPiseth/gitops-platform.git
      targetRevision: main
      path: platform/minio/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: minio-system
  revisionHistoryLimit: 10
  # Deliberately manual until Vault has produced the root Secret and all
  # pre-production storage/TLS checks have passed.
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
