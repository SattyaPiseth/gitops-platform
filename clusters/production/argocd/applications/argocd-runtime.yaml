apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-runtime
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://github.com/SattyaPiseth/gitops-platform.git
    targetRevision: main
    path: clusters/production/argocd/resources
    kustomize: {}

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  # Argo CD v2.14's static schema predates the Kubernetes v1.35 field.
  # Remove after upgrading Argo CD to a compatible release.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      # Required when Argo CD manages its own workloads and CRDs.
      - ServerSideApply=true
