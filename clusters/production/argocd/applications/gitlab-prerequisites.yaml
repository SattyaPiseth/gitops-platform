apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab-prerequisites
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "-2"

spec:
  project: gitlab

  sources:
    - repoURL: https://github.com/SattyaPiseth/gitops-platform.git
      targetRevision: main
      path: platform/gitlab

      directory:
        recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab

  syncPolicy:
    automated:
      selfHeal: true
      prune: true

    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      # Reconcile only actual drift. This avoids re-applying every healthy
      # Certificate, Vault resource, and database prerequisite when a single
      # NetworkPolicy changes.
      - ApplyOutOfSyncOnly=true
