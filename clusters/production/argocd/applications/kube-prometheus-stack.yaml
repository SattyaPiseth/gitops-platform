apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: kube-prometheus-stack
  namespace: argocd

spec:
  project: platform

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 87.21.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/helm-values/kube-prometheus-stack/values.yaml

    - repoURL: https://github.com/SattyaPiseth/gitops-platform.git
      targetRevision: main
      ref: values
      path: clusters/production/argocd/resources/kube-prometheus-stack

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  # Automated reconciliation enabled after successful GitOps adoption.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
      - PruneLast=true