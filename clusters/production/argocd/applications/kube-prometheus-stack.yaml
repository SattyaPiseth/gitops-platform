apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: platform

  sources:
    # Official kube-prometheus-stack chart.
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 87.21.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/helm-values/kube-prometheus-stack/values.yaml

    # Git source provides both $values and non-chart monitoring resources.
    - repoURL: https://github.com/SattyaPiseth/gitops-platform.git
      targetRevision: main
      ref: values
      path: clusters/production/argocd/resources/kube-prometheus-stack

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  # Phase A: manual first sync. Automation is enabled only after validation.
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      # Prometheus Operator CRDs are large. SSA avoids the client-side
      # last-applied annotation size limit and is appropriate for CRD adoption.
      # - ServerSideApply=true
