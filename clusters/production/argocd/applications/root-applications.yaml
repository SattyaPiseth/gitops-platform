apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-applications
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  sources:
    - repoURL: https://github.com/SattyaPiseth/gitops-platform.git
      targetRevision: main
      path: clusters/production/argocd/applications
      directory:
        recurse: false
        exclude: 'root-applications.yaml'

    - repoURL: https://github.com/SattyaPiseth/gitops-platform.git
      targetRevision: main
      path: clusters/production/argocd/projects
      directory:
        recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
