apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/instance: headlamp
spec:
  ingressClassName: traefik
  rules:
  - host: headlamp.k8s.tss.local
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: headlamp
            port: 
              number: 80
