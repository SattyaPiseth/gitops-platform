# Increase Git request timeout for argocd-repo-server.
#
# The default 15-second timeout is too short for intermittent outbound
# network latency to GitHub, causing "context deadline exceeded" errors
# during reconciliation.  60 seconds provides generous headroom without
# stalling the sync loop when the remote is genuinely unreachable.
#
# The application controller and repo-server must be restarted after applying:
#   kubectl rollout restart statefulset/argocd-application-controller -n argocd
#   kubectl rollout restart deployment/argocd-repo-server -n argocd

apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
data:
  # Keep reconciliation concurrency proportional to this small cluster.
  controller.status.processors: "10"
  controller.operation.processors: "5"
  controller.kubectl.parallelism.limit: "10"
  # Large multi-source Helm applications can exceed the 60-second default
  # after repo-server cache restarts.
  controller.repo.server.timeout.seconds: "180"
  # Keep per-resource health outside Application status to reduce writes and
  # controller pressure.
  controller.resource.health.persist: "false"
  # Bound concurrent manifest generation to avoid burst contention.
  reposerver.parallelism.limit: "2"
  reposerver.git.request.timeout: "60s"
