apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

# Pin the upstream base to prevent an implicit upgrade during reconciliation.
resources:
  - https://github.com/argoproj/argo-cd/manifests/cluster-install?ref=v3.3.14

# Preserve only intentional local deviations from the upstream installation.
patches:
  # Use annotation tracking to avoid collisions when external tools copy labels.
  - target:
      version: v1
      kind: ConfigMap
      name: argocd-cm
    patch: |-
      - op: add
        path: /data/application.resourceTrackingMethod
        value: annotation
  - target:
      version: v1
      kind: ConfigMap
      name: argocd-cmd-params-cm
    path: argocd-cmd-params-cm.yaml
  # Protect the application controller during cluster contention.
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: argocd-application-controller
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 750m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 2Gi
  # Preserve the existing API server availability.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: argocd-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
