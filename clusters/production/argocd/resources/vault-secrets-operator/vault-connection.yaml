apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: default
  namespace: vault-secrets-operator-system
spec:
  address: https://vault-active.vault.svc.cluster.local:8200
  # Secret must contain the trusted PEM CA chain under the key ca.crt.
  # Certificate/vault-ca-trust creates this Secret declaratively.
  caCertSecretRef: vault-ca
  skipTLSVerify: false
