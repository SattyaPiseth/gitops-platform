# Production Traefik IngressRoutes for kube-prometheus-stack.
#
# SECURITY BOUNDARY (Hardened):
# - Grafana handles application-level user authentication.
# - Prometheus and Alertmanager administrative endpoints are protected by Traefik
#   'monitoring-basic-auth' Middleware with credentials managed via Vault Secrets Operator.


apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`grafana.k8s.tss.local`)
      services:
        - kind: Service
          name: kube-prometheus-stack-grafana
          port: 80
  tls:
    secretName: grafana-tls

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`prometheus.k8s.tss.local`)
      middlewares:
        - name: monitoring-basic-auth
      services:
        - kind: Service
          name: kube-prometheus-stack-prometheus
          port: 9090
  tls:
    secretName: prometheus-tls

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`alertmanager.k8s.tss.local`)
      middlewares:
        - name: monitoring-basic-auth
      services:
        - kind: Service
          name: kube-prometheus-stack-alertmanager
          port: 9093
  tls:
    secretName: alertmanager-tls
