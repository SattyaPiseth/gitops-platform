# Normalized from the live production Traefik IngressRoutes.
# Server-generated metadata and kubectl last-applied annotations are intentionally omitted.
#
# SECURITY NOTE:
# The live routes do not reference any Middleware. TLS encrypts traffic but does not
# authenticate users. Preserve this exact behavior during Phase A adoption, then add
# an approved authentication boundary in a separate reviewed Phase B change.

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`grafana.k8s.tss.local`)
      services:
        - kind: Service
          name: kube-prometheus-stack-grafana
          port: 80
  tls:
    secretName: grafana-tls

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  entryPoints:
