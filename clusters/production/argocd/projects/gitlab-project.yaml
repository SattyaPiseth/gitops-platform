apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gitlab
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"

spec:
  description: Production GitLab platform

  sourceRepos:
    - https://charts.gitlab.io/
    - https://ot-container-kit.github.io/helm-charts
    - https://github.com/SattyaPiseth/gitops-platform.git

  destinations:
    - namespace: gitlab
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  orphanedResources:
    warn: true
    # Generated by cert-manager and CloudNativePG. Continue warning about all
    # other untracked resources in the GitLab namespace.
    ignore:
      - group: ""
        kind: Secret
        name: gitlab-tls
      - group: ""
        kind: Secret
        name: gitlab-kas-tls
      - group: ""
        kind: Secret
        name: gitlab-registry-tls
      - group: ""
        kind: Secret
        name: gitlab-postgresql-tls-ca
      - group: ""
        kind: Secret
        name: gitlab-postgresql-server-tls
      - group: ""
        kind: Secret
        name: gitlab-postgresql-replication-tls
      - group: ""
        kind: ConfigMap
        name: cnpg-default-monitoring
